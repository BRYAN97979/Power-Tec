<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POWER TEC - Tecnología y Electricidad</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #161616;
            --primary-yellow: #ffde00;
            --accent-yellow: #f2c200;
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --border-color: #262626;
            --whatsapp-green: #25d366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .brand-title {
            font-family: 'Orbitron', sans-serif;
        }

        /* Header & Nav */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(11, 11, 11, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        /* Estilo isotipo corporativo inspirado en tu logo */
        .logo-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 3px solid var(--text-white);
            border-left-color: var(--primary-yellow);
            border-top-color: var(--primary-yellow);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            box-shadow: 0 0 10px rgba(255, 222, 0, 0.3);
        }

        .logo-icon i {
            color: var(--primary-yellow);
            font-size: 1.2rem;
            filter: drop-shadow(0 0 2px rgba(255, 222, 0, 0.6));
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--text-white);
            letter-spacing: 1px;
        }

        .logo-text span {
            color: var(--primary-yellow);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
            align-items: center;
        }

        nav a {
            color: var(--text-gray);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: var(--primary-yellow);
        }

        .nav-cta {
            background-color: var(--primary-yellow);
            color: #000 !important;
            padding: 8px 18px;
            border-radius: 4px;
            font-weight: 700;
            transition: transform 0.2s, background-color 0.3s;
        }

        .nav-cta:hover {
            background-color: var(--accent-yellow);
            transform: scale(1.05);
        }

        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-white);
        }

        /* Hero Section */
        .hero {
            padding: 160px 5% 100px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 90vh;
            background: linear-gradient(135deg, #0b0b0b 0%, #1a1a00 100%);
            position: relative;
        }

        .hero-content {
            max-width: 650px;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(255, 222, 0, 0.1);
            color: var(--primary-yellow);
            border: 1px solid rgba(255, 222, 0, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero h1 {
            font-size: 3.2rem;
            line-height: 1.15;
            margin-bottom: 20px;
            font-weight: 900;
        }

        .hero h1 span {
            color: var(--primary-yellow);
            text-shadow: 0 0 20px rgba(255, 222, 0, 0.2);
        }

        .hero p {
            color: var(--text-gray);
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-primary {
            background-color: var(--primary-yellow);
            color: #000;
            padding: 14px 28px;
            border-radius: 6px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 222, 0, 0.3);
        }

        .btn-primary:hover {
            background-color: var(--accent-yellow);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 222, 0, 0.4);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-white);
            border: 2px solid var(--border-color);
            padding: 14px 28px;
            border-radius: 6px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            border-color: var(--primary-yellow);
            color: var(--primary-yellow);
            transform: translateY(-2px);
        }

        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-card-glow {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(255,222,0,0.15) 0%, rgba(11,11,11,0) 70%);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            border: 2px dashed rgba(255, 222, 0, 0.3);
            animation: rotateGlow 20s linear infinite;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hero-card-inner {
            width: 240px;
            height: 240px;
            background: var(--card-bg);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--primary-yellow);
            text-align: center;
            padding: 20px;
            box-shadow: 0 0 30px rgba(255, 222, 0, 0.2);
        }

        .hero-card-inner i {
            font-size: 3.5rem;
            color: var(--primary-yellow);
            margin-bottom: 10px;
        }

        .hero-card-inner span {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Secciones Generales */
        section {
            padding: 100px 5%;
        }

        .section-header {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 60px auto;
        }

        .section-header h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .section-header h2 span {
            color: var(--primary-yellow);
        }

        .section-header p {
            color: var(--text-gray);
            font-size: 1.05rem;
            line-height: 1.5;
        }

        /* Servicios Grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .service-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 35px 30px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: transparent;
            transition: background-color 0.3s;
        }

        .service-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 222, 0, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
